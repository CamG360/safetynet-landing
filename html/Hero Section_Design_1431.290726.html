<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></link>
  <script src="js/vendor/lucide.min.js"></script>
  <style id="__om-edit-overrides"></style>
</helmet>
<div style="font-family: Inter, sans-serif; background: #ffffff;">

  <nav style="width: 100%; position: fixed; top: 0; z-index: 40; background: transparent;">
    <div style="max-width: 1152px; margin: 0 auto; padding: 0 24px; height: 80px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 24px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px; text-shadow: 0 1px 8px rgba(2,6,23,.5);">
        <i data-lucide="shield-check" style="width: 22px; height: 22px;"></i>
        SafetyNet
      </div>
      <button style="padding: 10px 20px; min-height: 44px; font-size: 14px; font-weight: 700; color: #fff; background: #0d9488; border: none; border-radius: 999px; box-shadow: 0 10px 20px -6px rgba(13,148,136,.4); cursor: pointer;">Get Early Access</button>
    </div>
  </nav>

  <header style="position: relative; overflow: hidden; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <img src="images/SN_hero_centre_no-markings_light_GPT_1151.290726.webp" alt="A woman walking home along a riverside path at dusk inside a glowing SafetyNet protection sphere" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; z-index: 0;"></img>
    <div style="position: absolute; inset: 0; z-index: 1; background: linear-gradient(115deg, rgba(2,6,23,.72) 0%, rgba(2,6,23,.45) 45%, rgba(2,6,23,.15) 75%);"></div>

    <div style="position: relative; z-index: 2; max-width: 1152px; width: 100%; padding: 0 24px;">
      <div style="display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px; align-items: center;">

        <div style="display: flex; flex-direction: column; gap: 20px; align-items: flex-start; text-align: left;">
          <h1 style="font-size: clamp(2.25rem, 4vw, 3.75rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; color: #fff; max-width: 16ch; margin: 0; text-shadow: 0 2px 24px rgba(2,6,23,.55), 0 1px 4px rgba(2,6,23,.4);">
            "Text me when you're safe" fails when you can't text.
          </h1>
          <p style="font-size: clamp(1.375rem, 2vw, 1.875rem); font-weight: 400; line-height: 1.5; color: rgba(255,255,255,.85); margin: 0; text-shadow: 0 1px 10px rgba(2,6,23,.5);">
            SafetyNet sends an alert for you.
          </p>

          <button style="background: #0d9488; color: #fff; font-weight: 600; padding: 16px 32px; min-height: 44px; border: none; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 14px 28px -8px rgba(13,148,136,.5); white-space: nowrap; font-size: 18px; cursor: pointer;">
            Get Early Access <i data-lucide="arrow-right" style="width: 20px; height: 20px;"></i>
          </button>

          <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="width: 20px; height: 20px; border-radius: 999px; background: rgba(13,148,136,.9); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><i data-lucide="check" style="width: 13px; height: 13px; color: #fff;"></i></span>
              <span style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,.9);">Automatic alerts</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="width: 20px; height: 20px; border-radius: 999px; background: rgba(13,148,136,.9); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><i data-lucide="check" style="width: 13px; height: 13px; color: #fff;"></i></span>
              <span style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,.9);">Zero tracking</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="width: 20px; height: 20px; border-radius: 999px; background: rgba(13,148,136,.9); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><i data-lucide="check" style="width: 13px; height: 13px; color: #fff;"></i></span>
              <span style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,.9);">Your plans private</span>
            </div>
          </div>
        </div>

        <div>
          <div style="background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 24px 48px -12px rgba(2,6,23,.35); max-width: 380px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: #0f172a;">
                <span style="width: 22px; height: 22px; border-radius: 999px; background: #ccfbf1; display: flex; align-items: center; justify-content: center; color: #0d9488;"><i data-lucide="shield-check" style="width: 13px; height: 13px;"></i></span>
                SafetyNet
              </span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #0d9488;">
                <span style="width: 8px; height: 8px; border-radius: 999px; background: #0d9488; display: inline-block;"></span>
                Active
              </span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 16px; position: relative;">
              <div style="position: absolute; left: 15px; top: 15px; bottom: 15px; width: 2px; background: #e2e8f0; z-index: 0;"></div>

              <div style="display: flex; gap: 12px; align-items: flex-start; position: relative; z-index: 1;">
                <span style="width: 32px; height: 32px; border-radius: 999px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #334155; flex-shrink: 0;"><i data-lucide="clock" style="width: 16px; height: 16px;"></i></span>
                <span style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px;">
                  <span style="font-size: 13px; color: #64748b;">You set a check-in time</span>
                  <span style="font-size: 15px; font-weight: 700; color: #0f172a;">Home by 11:30 PM</span>
                </span>
              </div>

              <div style="display: flex; gap: 12px; align-items: flex-start; position: relative; z-index: 1;">
                <span style="width: 32px; height: 32px; border-radius: 999px; background: #fef3c7; display: flex; align-items: center; justify-content: center; color: #b45309; flex-shrink: 0;"><i data-lucide="alert-triangle" style="width: 16px; height: 16px;"></i></span>
                <span style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px;">
                  <span style="font-size: 13px; color: #64748b;">You don't check in</span>
                  <span style="font-size: 15px; font-weight: 700; color: #94a3b8;">No tap detected</span>
                </span>
              </div>

              <div style="display: flex; gap: 12px; align-items: flex-start; position: relative; z-index: 1; background: #f0fdfa; margin: 0 -8px; padding: 10px 8px; border-radius: 12px;">
                <span style="width: 32px; height: 32px; border-radius: 999px; background: #0d9488; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;"><i data-lucide="shield-alert" style="width: 16px; height: 16px;"></i></span>
                <span style="display: flex; flex-direction: column; gap: 6px; padding-top: 2px;">
                  <span style="font-size: 15px; font-weight: 700; color: #0f172a;">Your contacts are alerted</span>
                  <span style="display: flex; align-items: center; gap: 6px;">
                    <span style="width: 22px; height: 22px; border-radius: 999px; background: #0d9488; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; margin-left: -8px;">M</span>
                    <span style="width: 22px; height: 22px; border-radius: 999px; background: #4f46e5; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; margin-left: -8px;">A</span>
                    <span style="display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: #0d9488; margin-left: 4px;"><i data-lucide="check" style="width: 11px; height: 11px;"></i> Sent</span>
                  </span>
                  <span style="font-size: 12px; color: #94a3b8;">with your plans</span>
                </span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </header>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    if (window.lucide) window.lucide.createIcons();
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>

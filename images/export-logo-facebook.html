<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Export SafetyNet Logo</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; background: #f5f5f5; }
    canvas { border: 1px solid #ddd; background: white; max-width: 400px; max-height: 400px; }
    button { margin-top: 20px; padding: 12px 32px; font-size: 16px; background: #1877F2; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1666d0; }
    p { color: #555; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>SafetyNet Logo — Facebook Export</h2>
  <canvas id="c" width="1080" height="1080"></canvas>
  <button onclick="download()">Download PNG (1080×1080)</button>
  <p>Open this file in Chrome or Edge, then click the button above.</p>

  <script>
    const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="#ffffff"/>
  <circle cx="540" cy="540" r="350" fill="url(#glow)"/>
  <g transform="translate(365, 365) scale(7.292)"
     fill="none" stroke="#3b82f6" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <path d="M12 3 5 6v5c0 5 3.5 8.5 7 9 3.5-.5 7-4 7-9V6Z"/>
    <polyline points="9 12 12 15 16 10"/>
  </g>
  <g transform="translate(427.3, 427.3) scale(13.417)"
     fill="none" stroke="#3b82f6" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="7" r="4"/>
    <path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>
  </g>
</svg>`;

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0); URL.revokeObjectURL(url); };
    img.src = url;

    function download() {
      const a = document.createElement('a');
      a.download = 'safetynet-logo-facebook-1080.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
